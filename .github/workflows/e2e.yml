name: E2E

# dojo stays private behind Vercel SSO, and e2e never talks to a deployed
# preview - it builds the app and serves it locally (see
# playwright.config.ts), so there is no protected URL to reach and no
# bypass credential to manage. That means every PR, including one from a
# fork, can run this job with no secrets involved at all.
on:
  pull_request:
  # Lets a maintainer manually re-run e2e for a specific branch (e.g. from
  # the Actions tab or `gh workflow run`) without needing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright (builds and serves the app locally)
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
